id = "ts-lsp"
name = "TypeScript Language Server"
description = "TypeScript v7's native language server."
version = "1.1.0"
schema_version = 1
authors = ["Muhammad Azka Naufal <215347290+mhmdazkanfl@users.noreply.github.com>"]
repository = "https://github.com/mhmdazkanfl/ts-lsp"


[language_servers.ts-lsp]
name = "TypeScript Language Server"
# The native TypeScript server determines ScriptKind from LSP languageId (textDocument/didOpen).
# ScriptKind enum definition: https://github.com/microsoft/typescript-go/blob/main/internal/parser/parser.go (search for "type ScriptKind")
# Panic location (initializeState): https://github.com/microsoft/typescript-go/blob/main/internal/parser/parser.go#L210
# Maps Zed's language names to standard LSP languageId values:
#   typescript -> ScriptKindTS, typescriptreact -> ScriptKindTSX,
#   javascript -> ScriptKindJS, javascriptreact -> ScriptKindJSX
language_ids = { TypeScript = "typescript", TSX = "typescriptreact", JavaScript = "javascript", JSX = "javascriptreact" }
languages = ["TypeScript", "TSX", "JavaScript", "JSX"]
opt_in_languages = ["TypeScript", "TSX", "JavaScript", "JSX"]
